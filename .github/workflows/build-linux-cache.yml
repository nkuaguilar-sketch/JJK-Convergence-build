name: Build Linux Cache JJK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'

      - name: Download current source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download source-v0.8.4 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*source*.zip' \
            --dir .

      - name: Extract current source
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -name '*source*.zip' | head -1)

          echo "Usando:"
          echo "$ZIP"

          test -n "$ZIP" || {
            echo "No se encontró el ZIP source."
            exit 1
          }

          mkdir -p work
          unzip -q "$ZIP" -d work

          WRAPPER=$(find work -type f -name gradlew | head -1)

          test -n "$WRAPPER" || {
            echo "No se encontró gradlew."
            exit 1
          }

          PROJECT_DIR=$(dirname "$WRAPPER")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyecto encontrado en:"
          echo "$PROJECT_DIR"

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Show environment
        run: |
          mkdir -p build/linux-cache-logs

          java -version 2>&1 | tee build/linux-cache-logs/java.txt

          cd "$PROJECT_DIR"
          ./gradlew --version 2>&1 | tee "$GITHUB_WORKSPACE/build/linux-cache-logs/gradle.txt"

      - name: Compile project
        continue-on-error: true
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          set -o pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileJava \
            2>&1 | tee "$GITHUB_WORKSPACE/build/linux-cache-logs/compileJava.log"

      - name: Run GameTest server and download Linux dependencies
        continue-on-error: true
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          set +e
          set -o pipefail

          timeout 15m ./gradlew \
            --no-daemon \
            --stacktrace \
            runGameTestServer \
            2>&1 | tee "$GITHUB_WORKSPACE/build/linux-cache-logs/runGameTestServer.log"

          EXIT_CODE=${PIPESTATUS[0]}

          echo "GameTest exit code: $EXIT_CODE" \
            | tee -a "$GITHUB_WORKSPACE/build/linux-cache-logs/runGameTestServer.log"

          exit 0

      - name: Cache information
        if: always()
        run: |
          echo "===== modules-2 ====="
          du -sh ~/.gradle/caches/modules-2 2>/dev/null || true

          echo "===== neoformruntime ====="
          du -sh ~/.gradle/caches/neoformruntime 2>/dev/null || true

      - name: Upload Linux dependency cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jjk-linux-gradle-cache
          path: |
            /home/runner/.gradle/caches/modules-2
            /home/runner/.gradle/caches/neoformruntime
            build/linux-cache-logs
          if-no-files-found: warn
          compression-level: 6
          include-hidden-files: true
          retention-days: 7
