name: JJK - GameTests y recursos para pruebas locales

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Tag de la Release que contiene el ZIP fuente (ej. jjk-etapa3-build)'
        required: true
        default: 'jjk-etapa3-build'
        type: string

permissions:
  contents: read

jobs:
  gametests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Descargar fuentes actuales de Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          mkdir -p input project
          gh release download "$SOURCE_TAG" -R "$GITHUB_REPOSITORY" --pattern '*source*.zip' --dir input
          shopt -s nullglob
          zips=(input/*source*.zip)
          if (( ${#zips[@]} != 1 )); then
            echo 'Se necesita exactamente un ZIP fuente en la Release'
            exit 1
          fi
          unzip -q "${zips[0]}" -d project
          mapfile -t wrappers < <(find project -type f -name gradlew)
          if (( ${#wrappers[@]} != 1 )); then
            echo 'No se encontro exactamente un Gradle Wrapper'
            exit 1
          fi
          P="$(cd "$(dirname "${wrappers[0]}")" && pwd)"
          test -f "$P/build.gradle"
          echo "PROJECT_DIR=$P" >> "$GITHUB_ENV"
          mkdir -p logs

      - name: GameTests maldiciones originales (Etapa 3)
        shell: bash
        run: |
          set +e
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew runGameTestServer -PjjkOriginalCurseChecks=true --no-daemon --stacktrace > "$GITHUB_WORKSPACE/logs/gametest-originales.log" 2>&1
          echo "$?" > "$GITHUB_WORKSPACE/logs/estado-originales.txt"
          tail -n 90 "$GITHUB_WORKSPACE/logs/gametest-originales.log"
          exit 0

      - name: GameTests de regresion de formas vanilla (Etapa 2)
        shell: bash
        run: |
          set +e
          cd "$PROJECT_DIR"
          ./gradlew runGameTestServer -PjjkCurseFormChecks=true --no-daemon --stacktrace > "$GITHUB_WORKSPACE/logs/gametest-formas.log" 2>&1
          echo "$?" > "$GITHUB_WORKSPACE/logs/estado-formas.txt"
          tail -n 90 "$GITHUB_WORKSPACE/logs/gametest-formas.log"
          exit 0

      - name: Reunir logs de servidor
        if: always()
        shell: bash
        run: |
          mkdir -p logs/server
          if [ -n "${PROJECT_DIR:-}" ]; then
            find "$PROJECT_DIR" -type f \( -name latest.log -o -name crash-report\*.txt \) -print | while read -r f; do
              cp "$f" "logs/server/$(basename "$(dirname "$f")")-$(basename "$f")" || true
            done
          fi

      - name: Exportar recursos de ejecucion para usar offline en ChatGPT
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline-runtime
          if [ -d "$HOME/.gradle/caches" ]; then
            # Comprimimos y dividimos para evitar archivos gigantes; cada parte es <= 75 MiB.
            tar -C "$HOME/.gradle" --exclude='*.lock' -czf - caches | split -b 75M - offline-runtime/gradle-runtime.tar.gz.parte-
          fi
          if [ -n "${PROJECT_DIR:-}" ] && [ -d "$PROJECT_DIR/build" ] && [ -d "$PROJECT_DIR/.gradle" ]; then
            tar -C "$PROJECT_DIR" --exclude='*.lock' -czf - build .gradle | split -b 75M - offline-runtime/minecraft-build.tar.gz.parte-
          fi
          cat > offline-runtime/INSTRUCCIONES.txt <<'TEXT'
          Reunir partes en orden alfabetico:
          cat gradle-runtime.tar.gz.parte-* > gradle-runtime.tar.gz
          cat minecraft-build.tar.gz.parte-* > minecraft-build.tar.gz
          La cache contiene assets de Minecraft, metadatos y configuraciones NeoForge si la descarga/GameTests los resolvio.
          El segundo archivo es exclusivamente auxiliar: nunca debe reemplazar codigo reciente del mod.
          TEXT

      - name: Descargar resultados de GameTests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JJK-GAMETEST-LOGS
          path: logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Descargar recursos offline divididos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JJK-GAMETEST-RECURSOS-OFFLINE
          path: offline-runtime/
          compression-level: 0
          if-no-files-found: warn
          retention-days: 30

      - name: Resultado final verificado
        shell: bash
        run: |
          set -e
          for f in logs/estado-originales.txt logs/estado-formas.txt; do
            test -f "$f"
            if [ "$(cat "$f")" != 0 ]; then
              echo "GameTest fallo. Revisar logs: $f"
              exit 1
            fi
          done
          echo 'Los dos comandos de GameTest terminaron con codigo 0.'
