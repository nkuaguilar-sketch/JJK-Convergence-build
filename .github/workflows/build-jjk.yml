
name: Build JJK Convergence

on:
  workflow_dispatch:
  push:
    paths:
      - '*source*.zip'
      - '.github/workflows/build-jjk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract source
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -name '*source*.zip' | sort -V | tail -1)
          test -n "$ZIP" || { echo "Falta ZIP fuente"; exit 1; }
          mkdir work
          unzip -q "$ZIP" -d work
          WRAPPER=$(find work -type f -name gradlew | head -1)
          test -n "$WRAPPER" || { echo "Falta gradlew"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Build NeoForge
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assemble --no-daemon --stacktrace

      - name: Collect JAR
        run: |
          mkdir artifacts
          find "$PROJECT_DIR" -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} artifacts/ \;
          test -n "$(ls -A artifacts)"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: JJK-Convergence-JAR
          path: artifacts/*.jar
          if-no-files-found: error
  
